name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chautari_test
          POSTGRES_USER: chautari
          POSTGRES_PASSWORD: chautari
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chautari -d chautari_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://chautari:chautari@127.0.0.1:5432/chautari_test
      AUTH_SECRET: ci-only-secret-not-used-in-production
      AUTH_TRUST_HOST: "true"
      APP_URL: http://localhost:3000
      ADMIN_ALLOWED_EMAILS: admin@chautari.dk
      SUPER_ADMIN_EMAILS: admin@chautari.dk
      DEV_LOGIN_ENABLED: "true"
      SEED_ADMIN_EMAIL: admin@chautari.dk
      SEED_SAMPLE_CONTENT: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Seed production-safe data
        run: NODE_ENV=production npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify production seed skipped demo content
        run: |
          COUNT="$(psql "$DATABASE_URL" -tAc "select count(*) from articles where slug = 'chautari-new-digital-edition';")"
          test "$COUNT" = "0"
